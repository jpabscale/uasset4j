name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Fetch test corpus (UAssetAPI.Tests/TestAssets)
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import tarfile
          import urllib.request

          sha = ""
          with open("gradle.properties") as f:
              for line in f:
                  line = line.strip()
                  if line.startswith("uassetapi.pinned.sha="):
                      sha = line.split("=", 1)[1].strip()
          if not sha:
              raise SystemExit("uassetapi.pinned.sha missing in gradle.properties")

          tarball = "uassetapi.tar.gz"
          urllib.request.urlretrieve(f"https://codeload.github.com/atenfyr/UAssetAPI/tar.gz/{sha}", tarball)
          with tarfile.open(tarball) as tf:
              tf.extractall("uassetapi-src")

          matches = glob.glob("uassetapi-src/*/UAssetAPI.Tests/TestAssets")
          if not matches:
              raise SystemExit("TestAssets dir not found in tarball")
          dst = "uassetapi/src/test/resources/testassets"
          shutil.rmtree(dst, ignore_errors=True)
          shutil.move(matches[0], dst)

          # AC7Key.bin is a UAssetAPI resource (Ace Combat 7 decrypt key), not committed here.
          key_matches = glob.glob("uassetapi-src/*/UAssetAPI/Resources/AC7Key.bin")
          if not key_matches:
              raise SystemExit("AC7Key.bin not found in tarball")
          key_dst = "uassetapi/src/main/resources/AC7Key.bin"
          os.makedirs(os.path.dirname(key_dst), exist_ok=True)
          shutil.copy2(key_matches[0], key_dst)

          os.remove(tarball)
          shutil.rmtree("uassetapi-src")
          print("corpus ->", dst)
          print("AC7Key.bin ->", key_dst)
          PY

      - name: Build and test
        shell: bash
        run: ./gradlew build

      - name: Upload test results
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: uassetapi/build/test-results/
          if-no-files-found: ignore

      - name: Upload fat jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: uassetcli
          path: uassetcli/build/libs/uassetcli.jar
          if-no-files-found: error

  release:
    name: Release fat jar
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build fat jar
        run: ./gradlew :uassetcli:shadowJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: uassetcli/build/libs/uassetcli.jar
          generate_release_notes: true
